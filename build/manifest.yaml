# Single source of truth for every file/directory path referenced by the
# manuscripts. Keys are referenced from build/manuscript_v7.tex.tmpl as
# <<FILE:key>> (file) or <<DIR:key>> (directory) tokens.
#
#   root_path      path as rendered in the ROOT manuscript (relative to repo root)
#   preprint_path  path as rendered in the preprint manuscript (relative to the
#                  preprint folder)
#   copy_from      single physical copy (root layout) — MUST exist
#   copy_to        destination inside preprints/v7_arrow_of_time/ when building
#                  the preprint bundle
#   adapt          optional list of [find, replace] applied to the file content
#                  when copying to the preprint (layout-specific lines, e.g.
#                  sys.path pointing at ../code at root vs . in the bundle)

# ---------- one-off files that exist identically in both layouts ----------

audit_gates:
  root_path: "code/audit_gates.py"
  preprint_path: "code/audit_gates.py"
  copy_from: "code/audit_gates.py"
  copy_to: "code/audit_gates.py"

supplement_b:
  root_path: "SUPPLEMENT_B_AUDIT_HANDBOOK.md"
  preprint_path: "SUPPLEMENT_B_AUDIT_HANDBOOK.md"
  copy_from: "SUPPLEMENT_B_AUDIT_HANDBOOK.md"
  copy_to: "SUPPLEMENT_B_AUDIT_HANDBOOK.md"

# ---------- v7 experiment scripts: root keeps them in matrix/, the
# preprint bundle self-contains them in code/. Six of them carry a
